[project]
name = "lang-chain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "stranger-pro", email = "aditya9322singh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.4",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.2",
]

[project.scripts]
lang-chain = "lang_chain:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package=false
